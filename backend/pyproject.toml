[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-backend"
version = "0.0.1"
description = "Simple local agentic coder."
readme = "README.md"
requires-python = ">=3.14" # The minimum supported Python version
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Kaoticz", email = "1812311+Kaoticz@users.noreply.github.com"},
]
dependencies = [
    "aiofiles",
    "bcrypt",
    "beautifulsoup4",
    "setuptools",
    "wheel",
    "beartype",
    "markdownify",
    "httpx",
    "fastapi[standard]",
    "tortoise",
    "tortoise-orm[asyncpg]",
    "aerich[toml]",
    "pydantic",
    "pydantic-ai>=1.67.0,<1.68.0",
    "pyjwt"
]

[tool.setuptools.packages.find]
where = ["."] # Look in the current directory

[tool.aerich]
tortoise_orm = "database.tortoise_config.TORTOISE_ORM"
location = "database/migrations"
verbosity = 1

[tool.mypy]
python_version = 3.14
strict = true
local_partial_types = true
plugins = ["pydantic.mypy"]
exclude = ".venv/"
disable_error_code = ["import-untyped"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true
reportDeprecated = true
reportUnannotatedClassAttribute = true
reportImplicitOverride = true
reportUnknownLambdaType = false

[project.optional-dependencies]
dev = [
    "setuptools",   # Often needed for tools in editable mode
    "mypy",
    "basedpyright"
]

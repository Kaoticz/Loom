[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-backend"
version = "0.0.1"
description = "Simple local agentic coder."
readme = "README.md"
requires-python = ">=3.14" # The minimum supported Python version
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Kaoticz", email = "1812311+Kaoticz@users.noreply.github.com"},
]
dependencies = [
    "aiofiles==25.1.0",
    "bcrypt==5.0.0",
    "beautifulsoup4==4.15.0",
    "setuptools==84.0.0",
    "wheel==0.48.0",
    "beartype==0.22.9",
    "markdownify==1.2.3",
    "httpx==0.28.1",
    "fastapi[standard]==0.141.1",
    "tortoise-orm[asyncpg]==1.1.8",
    "aerich[toml]==0.10.0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.4",
    "pydantic-ai==2.33.0",
    "pydantic-ai-harness==0.25.0",
    "pyjwt==2.13.0",
    "tortoise-embeddings==2.0.1",
    "dishka==1.10.1",
    "GitPython==3.1.59",
    "docker==7.2.0",
    "ollama==0.6.3",
    "python-multipart==0.0.32"
]

[tool.setuptools.packages.find]
where = ["."] # Look in the current directory

[tool.aerich]
tortoise_orm = "database.tortoise_config.TORTOISE_ORM"
location = "database/migrations"
verbosity = 1

[tool.mypy]
python_version = 3.14
strict = true
local_partial_types = true
plugins = ["pydantic.mypy"]
exclude = ".venv/"
disable_error_code = ["import-untyped"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pyright]
pythonVersion = "3.14" # The only supported version; do not infer it from the interpreter in use
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true
reportDeprecated = true
reportUnannotatedClassAttribute = true
reportImplicitOverride = true
reportUnknownLambdaType = false

[project.optional-dependencies]
dev = [
    "setuptools==84.0.0",   # Often needed for tools in editable mode
    "mypy==2.3.1",
    "basedpyright==1.39.10",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. asyncpg binds a connection to the loop
# that opened it, so a schema built once and shared cannot live in a per-test
# loop. This is a consequence of running the tests against the real database
# rather than an in-memory one, and the alternative was rebuilding the schema for
# every test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Raised when a Tortoise connection made on one event loop is reused on
    # another, which the Postgres fixtures do deliberately.
    "ignore::tortoise.warnings.TortoiseLoopSwitchWarning",
]
markers = [
    "integration: exercises the whole stack and needs Postgres",
]

# Suites that need external services skip themselves unless these are set:
#   TEST_DATABASE_URL  a Postgres instance with pgvector available
#   AST_GREP_BIN       path to an ast-grep executable, if not on PATH
# Everything else runs with no external dependencies.

services:
  postgres:
    container_name: loom-postgres
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: loom
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loom -d loom']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    container_name: loom-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./data/ollama:/root/.ollama/models
    ports:
      - '11434:11434'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Checks if something is listening on port 11434
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/11434' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  searxng:
    container_name: loom-searxng
    image: searxng/searxng:latest
    ports:
      - '8080:8080'
    volumes:
      - ./data/searxng:/etc/searxng:Z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  backend:
    container_name: loom-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      #- /var/run/docker.sock:/var/run/docker.sock  # If you use Docker
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:Z    # If you use Podman
      - .:/user_repo # Bind mount for the target repository
      #- /home/kotz:/host:rw # Mount host root to /host inside container with read-write access
    environment:
      - DATABASE_URL=postgres://loom:loom_password@postgres:5432/loom
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      searxng:
        condition: service_started

  frontend:
    container_name: loom-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:

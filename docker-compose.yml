services:
  postgres:
    container_name: loom-postgres
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: loom_db
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loom -d loom_db']
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    container_name: loom-ollama
    environment:
      - OLLAMA_CONTEXT_LENGTH=131072 # Default: 8192 - Maximum amount of tokens models can use for their context window
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./data/ollama:/root/.ollama/models
    ports:
      - '11434:11434'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Checks if something is listening on port 11434
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/11434' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  searxng:
    container_name: loom-searxng
    image: searxng/searxng:latest
    ports:
      - '8080:8080'
    volumes:
      - ./data/searxng:/etc/searxng:Z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:8080/healthz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    container_name: loom-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Must match the group that owns the socket on the host:
        #   stat -c '%g' /var/run/docker.sock
        DOCKER_GID: ${DOCKER_GID:-999}
    # Defaults keep the service usable when UID and GID are not exported; without
    # them the substitution yields an empty string and the container fails to start.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
      # The container runtime socket, used to spawn sandbox containers. Docker's
      # path is the default. For rootless Podman, set CONTAINER_SOCKET in .env:
      #   CONTAINER_SOCKET=/run/user/1000/podman/podman.sock
      # SELinux hosts additionally need the :Z relabel, which cannot be expressed
      # in a variable; use docker-compose.podman.yml for that case.
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./data/repo:/tmp/repo # Bind mount for the target repository
    # The same file a direct run reads. Optional, so a fresh clone works without
    # one. Anything under `environment` below wins over it, which is what keeps
    # the container pointed at the service names rather than a developer's
    # localhost values.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgres://loom:loom_password@postgres:5432/loom_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARXNG_URL=http://searxng:8080
    ports:
      - '8000:8000'
    healthcheck:
      # The endpoint queries the database, so a passing check means the service
      # can actually answer requests, not merely that the port is open.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy

  frontend:
    container_name: loom-frontend
    env_file:
      - path: ./frontend/.env
        required: false
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      # Set explicitly: the frontend falls back to a hardcoded address otherwise,
      # so changing the published backend port would break the WebSocket while
      # leaving REST working.
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:8000/api/v1/agent-session}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
